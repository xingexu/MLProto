name: ci
on: [push, pull_request]
jobs:
  ml-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Evaluation (fails if InForce regresses)
        run: |
          python -m inforce.evaluate
          python -m inforce.evaluate --json | python -c "import json,sys; m=json.load(sys.stdin)['modes']['lifecycle']; assert m['confident_stale_rate']==0 and m['accuracy']==1, m"
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B test
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
      - run: npm run lint
      - run: npm run build
