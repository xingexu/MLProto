apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "inforce.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-api }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-api }
    spec:
      containers:
        - name: api
          image: {{ include "inforce.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports: [{ containerPort: 8080 }]
          env:
            - { name: ML_BASE_URL, value: "http://{{ .Release.Name }}-ml:8000" }
            - { name: DATABASE_URL, value: {{ .Values.database.url | quote }} }
            - { name: DATABASE_USER, value: {{ .Values.database.user | quote }} }
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordKey }}
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, periodSeconds: 5, failureThreshold: 30 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 8080 }, periodSeconds: 20 }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "inforce.labels" . | nindent 4 }}
spec:
  selector: { app: {{ .Release.Name }}-api }
  ports: [{ port: 8080, targetPort: 8080 }]
