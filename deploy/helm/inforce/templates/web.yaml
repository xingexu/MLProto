apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "inforce.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-web }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-web }
    spec:
      containers:
        - name: web
          image: {{ include "inforce.image" (dict "root" . "name" "web") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports: [{ containerPort: 3000 }]
          env:
            - { name: API_URL, value: "http://{{ .Release.Name }}-api:8080" }
          readinessProbe: { httpGet: { path: /, port: 3000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: 3000 }, periodSeconds: 20 }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "inforce.labels" . | nindent 4 }}
spec:
  selector: { app: {{ .Release.Name }}-web }
  ports: [{ port: 80, targetPort: 3000 }]
