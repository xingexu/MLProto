server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: inforce-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/inforce}
    username: ${DATABASE_USER:inforce}
    password: ${DATABASE_PASSWORD:inforce}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
inforce:
  ml-base-url: ${ML_BASE_URL:http://localhost:8000}
  ml-timeout: 10s
  allowed-origins: ${ALLOWED_ORIGINS:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
